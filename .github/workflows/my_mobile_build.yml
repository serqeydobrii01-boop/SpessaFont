name: Mobile APK Generator (The Winner)
on: [workflow_dispatch, push]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build:fast

      - name: Setup Java (FORCE 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK and Licenses
        uses: android-actions/setup-android@v3
      
      - name: Accept Licenses
        run: yes | sdkmanager --licenses || true

      - name: Final Android Build
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # Проверяем папку
          [ -d "dist" ] && WEB_DIR="dist" || WEB_DIR="."
          npx cap init "SpessaFontMobile" "com.my.spessafont" --web-dir $WEB_DIR
          npx cap add android
          
          # Фикс версий Kotlin прямо в файлах проекта
          npx cap update android
          
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpessaFont-Mobile-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
