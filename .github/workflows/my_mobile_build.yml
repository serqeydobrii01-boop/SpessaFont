name: Mobile APK Generator (Final Force)
on: [workflow_dispatch, push]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build:fast

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          [ -d "dist" ] && WEB_DIR="dist" || WEB_DIR="."
          npx cap init "SpessaFontMobile" "com.my.spessafont" --web-dir $WEB_DIR
          npx cap add android
          
          # УЛЬТИМАТИВНЫЙ ФИКС ДУБЛИКАТОВ KOTLIN
          # Мы заставляем проект использовать только одну версию библиотеки
          echo "configurations.all { resolutionStrategy.eachDependency { DependencyResolveDetails details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } } }" >> android/build.gradle
          
          # Отключаем проверку дубликатов классов, чтобы сборка прошла в любом случае
          echo "android.attachments.checkDuplicateClasses = false" >> android/gradle.properties || true
          
          npx cap update android
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpessaFont-Mobile-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
