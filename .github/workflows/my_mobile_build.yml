name: Mobile APK Generator (Final Strike)
on: [workflow_dispatch, push]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build:fast

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Final Force Build
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          [ -d "dist" ] && WEB_DIR="dist" || WEB_DIR="."
          npx cap init "SpessaFontMobile" "com.my.spessafont" --web-dir $WEB_DIR
          npx cap add android
          
          # ГЛАВНЫЙ ФИКС: правим билд-файл именно внутри папки APP
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle
          
          # Отключаем проверку дубликатов везде, где можно
          echo "android.attachments.checkDuplicateClasses=false" >> android/gradle.properties
          echo "android.enforceUniquePackageName=false" >> android/gradle.properties
          
          npx cap update android
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpessaFont-Mobile-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
