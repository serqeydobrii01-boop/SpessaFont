name: Mobile APK Generator
on: [workflow_dispatch, push]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Version
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor and Build APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # Проверяем, есть ли папка dist или build
          [ -d "dist" ] && WEB_DIR="dist" || WEB_DIR="build"
          npx cap init "SpessaFontMobile" "com.my.spessafont" --web-dir $WEB_DIR
          npx cap add android
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v3
        with:
          name: My-Mobile-SpessaFont
          path: android/app/build/outputs/apk/debug/app-debug.apk
