name: Mobile APK Generator (Final Force)
on: [workflow_dispatch, push]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build:fast

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build APK via Capacitor (Clean Way)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # Создаем чистый проект без старых конфликтов
          npx cap init "SpessaFontMobile" "com.my.spessafont" --web-dir dist
          npx cap add android
          
          # Жестко прописываем версию Kotlin, чтобы не было конфликтов
          sed -i 's/kotlin_version = .*/kotlin_version = "1.9.10"/g' android/variables.gradle
          
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SpessaFont-Mobile-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
