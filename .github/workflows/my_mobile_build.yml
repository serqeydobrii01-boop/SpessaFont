name: Mobile APK Generator (Force Build)
on: [workflow_dispatch, push]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build:fast

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Final Force Build
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          [ -d "dist" ] && WEB_DIR="dist" || WEB_DIR="."
          npx cap init "SpessaFontMobile" "com.my.spessafont" --web-dir $WEB_DIR
          npx cap add android
          
          # ХАК: Исправляем конфликт дубликатов Kotlin через build.gradle
          echo "android.pickFirsts += ['**/kotlin-stdlib-jdk8', '**/kotlin-stdlib-jdk7', '**/kotlin-stdlib']" >> android/app/build.gradle
          
          # Принудительно выравниваем версии Kotlin в переменной проекта
          sed -i 's/kotlin_version = .*/kotlin_version = "1.9.10"/g' android/variables.gradle
          
          npx cap update android
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpessaFont-Mobile-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
